<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Dialogueで行われたプレゼンテーションと読書会の記録。" />
    <title>活動Log | Dialogue — AIU</title>
    <link rel="stylesheet" href="assets/styles.css" />
  </head>
  <body data-page="log">
    <a class="skip-link" href="#main">本文へ移動</a>
    <header id="site-header"></header>
    <main id="main">
      <section class="page-intro page-intro--log" aria-labelledby="page-title">
        <p class="eyebrow">Activity Log</p>
        <h1 id="page-title">対話のあとに、<br />残るもの。</h1>
        <p>これまでの発表資料と活動の記録を公開しています。</p>
      </section>

      <section class="archive" aria-labelledby="archive-title">
        <div class="archive__heading">
          <p class="section-label">Introduction-based reading sessions</p>
          <h2 id="archive-title">紹介型読書会の資料</h2>
          <p>各回のスライドを、ブラウザで閲覧またはPDFとしてダウンロードできます。</p>
        </div>
        <div id="log-list" class="log-list" aria-live="polite"></div>
        <noscript><p class="empty-log">資料一覧を表示するには、JavaScriptを有効にしてください。</p></noscript>
      </section>

      <section class="log-note" aria-labelledby="note-title">
        <h2 id="note-title">資料を掲載したいメンバーへ</h2>
        <p>発表資料はPDFにして、運営メンバーへ共有してください。掲載の可否を確認したうえで追加します。</p>
      </section>
    </main>
    <footer id="site-footer"></footer>
    <script src="assets/log/logs.js"></script>
    <script src="assets/site.js"></script>
  </body>
</html>
